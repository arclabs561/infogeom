[package]
name = "infogeom"
version = "0.2.1"
edition = "2021"
description = "Information geometry on the probability simplex"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/arclabs561/infogeom"
homepage = "https://github.com/arclabs561/infogeom"
documentation = "https://github.com/arclabs561/infogeom#readme"
readme = "README.md"
keywords = ["information-geometry", "fisher-rao", "divergence", "riemannian-geometry"]
categories = ["science", "mathematics"]

[workspace]

[dependencies]
thiserror = "2.0"
logp = "0.2"
skel = { version = "0.1", optional = true }
ndarray = { version = "0.16", optional = true }

[features]
manifold = ["dep:skel", "dep:ndarray"]

[[example]]
name = "manifold_simplex"
required-features = ["manifold"]

[[example]]
name = "ot_interpolation_geometry"
required-features = ["manifold"]

[dev-dependencies]
proptest = "1.9"
wass = "0.2.2"
ndarray = "0.16"
skel = "0.1.7"
